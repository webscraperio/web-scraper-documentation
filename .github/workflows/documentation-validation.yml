name: Markdown Lint

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Create markdownlint config
        run: |
          echo '{
            "MD013": false
          }' > .markdownlint.json
      - name: Run Markdown Lint
        uses: avto-dev/markdown-lint@v1.5.0
        with:
          args: '**/*.md'
          fix: true
